    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        
        /* Custom Scrollbar */

        /* Animasi Efek Cahaya Elegan Untuk Logo */

            50% { filter: drop-shadow(0 0 30px rgba(255, 255, 255, 1)) drop-shadow(0 0 40px rgba(59, 130, 246, 0.9)); transform: scale(1.05); }
            100% { filter: drop-shadow(0 0 10px rgba(59, 130, 246, 0.4)); transform: scale(1); }

        .animate-logo-glow { animation: pulseGlow 2.5s infinite ease-in-out; }

        #sidebar { transition: transform 0.3s ease-in-out; z-index: 50; }

        /* TEMA BIRU, HITAM, PUTIH UNTUK LOGIN */
        .glass-dark { 
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(59, 130, 246, 0.3);
            box-shadow: 0 0 40px rgba(0,0,0,0.6), 0 0 15px rgba(59,130,246,0.25);
        }
        .text-glow-blue { text-shadow: 0 0 10px rgba(59, 130, 246, 0.8), 0 0 20px rgba(59, 130, 246, 0.4); }
        .input-glow:focus { box-shadow: 0 0 15px rgba(59, 130, 246, 0.6); border-color: #3b82f6 !important; }
        
        /* Print Styles - Cetak PDF / Cetak Langsung Bawaan Browser */
        @media print {
            body { background: white !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            body * { visibility: hidden !important; }
            body.printing-rapot #rapot-preview, body.printing-rapot #rapot-preview * { visibility: visible !important; }
            body.printing-rapot #rapot-preview { 
                position: absolute !important; left: 0 !important; top: 0 !important; width: 100% !important; 
                border: none !important; box-shadow: none !important; padding: 10px !important; margin: 0 !important; background: white !important;
            }
            aside, header, button, .no-print { display: none !important; }
        }
    </style>

<body class="text-gray-800 h-screen overflow-hidden flex flex-col">

        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";

        ];

        window.appState = {
            user: null, 
            currentView: 'dashboard',
            students: [],

            grades: {}, 
            descriptions: {}, 
            sidebarOpen: false,
            settings: {
                schoolName: "SD NEGERI 06 MANADO",
                schoolAddress: "Jl. Sarapung No 24 Kec. Wenang Utara",
                academicYear: "2026/2027",
                semester: "Ganjil",
                headmasterName: "Dr. Dra. Hj. Fatimah M., M.Pd",
                headmasterNip: "19750817 199903 1 005",
                printDate: "Manado, 18 Desember 2026",
                loginBg: "https://images.unsplash.com/photo-1580582932707-520aed937b7b?q=80&w=2000",
                dashBg: "https://images.unsplash.com/photo-1541339907198-e08756dedf3f?q=80&w=2000",
                mainLogo: "cropped-Logo-Tut-Wuri-Handayani-PNG-Warna-1.webp",
                kopLeftLogo: "Lambang_Kota_Manado.jpg",
                kopRightLogo: "cropped-Logo-Tut-Wuri-Handayani-PNG-Warna-1.webp"
            }
        };

        const demoAccounts = {
            'admin': { role: 'Admin', name: 'Administrator System', password: '123' },
            'kepsek': { role: 'Kepsek', name: 'Dr. Dra. Hj. Fatimah M., M.Pd', password: '123' },
            'wali_1a': { role: 'Wali Kelas', name: 'Guru Wali 1A', assignedClass: 'IA', password: '123' },
            'wali_1b': { role: 'Wali Kelas', name: 'Guru Wali 1B', assignedClass: 'IB', password: '123' },
            'wali_2': { role: 'Wali Kelas', name: 'Guru Wali 2', assignedClass: 'II', password: '123' },
            'wali_3a': { role: 'Wali Kelas', name: 'Guru Wali 3A', assignedClass: 'IIIA', password: '123' },
            'wali_3b': { role: 'Wali Kelas', name: 'Guru Wali 3B', assignedClass: 'IIIB', password: '123' },
            'wali_3c': { role: 'Wali Kelas', name: 'Guru Wali 3C', assignedClass: 'IIIC', password: '123' },
            'wali_4a': { role: 'Wali Kelas', name: 'Guru Wali 4A', assignedClass: 'IVA', password: '123' },
            'wali_4b': { role: 'Wali Kelas', name: 'Guru Wali 4B', assignedClass: 'IVB', password: '123' },
            'wali_4c': { role: 'Wali Kelas', name: 'Guru Wali 4C', assignedClass: 'IVC', password: '123' },
            'wali_5a': { role: 'Wali Kelas', name: 'Guru Wali 5A', assignedClass: 'VA', password: '123' },
            'wali_5b': { role: 'Wali Kelas', name: 'Guru Wali 5B', assignedClass: 'VB', password: '123' },
            'wali_5c': { role: 'Wali Kelas', name: 'Guru Wali 5C', assignedClass: 'VC', password: '123' },
            'wali_6a': { role: 'Wali Kelas', name: 'Guru Wali 6A', assignedClass: 'VIA', password: '123' },
            'wali_6b': { role: 'Wali Kelas', name: 'Guru Wali 6B', assignedClass: 'VIB', password: '123' },
            'wali_6c': { role: 'Wali Kelas', name: 'Guru Wali 6C', assignedClass: 'VIC', password: '123' },
            'mapel_pjok': { role: 'Guru Mapel', name: 'Guru PJOK', assignedSubject: 'PJOK', password: '123' },
            'mapel_inggris': { role: 'Guru Mapel', name: 'Guru B. Inggris', assignedSubject: 'Bahasa Inggris', password: '123' },
            'mapel_agamak': { role: 'Guru Mapel', name: 'Guru Agama Kristen', assignedSubject: 'Pendidikan Agama Kristen & Budi Pekerti', password: '123' },
            'mapel_agamai': { role: 'Guru Mapel', name: 'Guru Agama Islam', assignedSubject: 'Pendidikan Agama Islam & Budi Pekerti', password: '123' },
            'mapel_kka': { role: 'Guru Mapel', name: 'Guru KKA', assignedSubject: 'KKA (Koding dan Kecerdasan Artifisial)', password: '123' }
        };

        // KODE FIREBASE ANDA SESUAI SCREENSHOT
        const appId = 'sipandai-06-36543'; // Disesuaikan dengan Project ID Anda
        const firebaseConfig = {
            apiKey: "AIzaSyAxXMEiorBbQoJO2YqW4TWdNm33X0lNsjY",
            authDomain: "sipandai-06-36543.firebaseapp.com",
            projectId: "sipandai-06-36543",
            storageBucket: "sipandai-06-36543.firebasestorage.app",
            messagingSenderId: "760127633818",
            appId: "1:760127633818:web:1ae67b75927bc1ed45e223",
            measurementId: "G-9H4XRH5K5G"
        };
        
        let app, db, auth;
        if (firebaseConfig) {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
        }

        async function initCloudApp() {
            UI.showLoading();
            
            // ANTI-MACET: Paksa loading berhenti maksimal setelah 5 detik
            setTimeout(() => {
                const loader = document.getElementById('global-loader');
                if(loader && !loader.classList.contains('hidden')) {
                    console.log("Failsafe: Memaksa masuk karena koneksi lambat...");
                    initMocks();
                    UI.hideLoading();
                }
            }, 5000);

            if (!auth) {
                initMocks();
                UI.hideLoading(); 
                return;
            }
            try {
                if (typeof __initial_auth_token !== 'undefined') {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                listenToCloudDatabase();
            } catch (e) {
                console.error("Auth Cloud Error", e);
                // Jika error Auth (karena belum diaktifkan), tetap isi data mock agar admin BISA login!
                initMocks(); 
                UI.hideLoading();
            }
        }

        function initMocks() {
            if (appState.teachers.length === 0) {
                Object.keys(demoAccounts).forEach((key, index) => {
                    let acc = demoAccounts[key];
                    appState.teachers.push({
                        id: key, name: acc.name, role: acc.role,
                        nip: '198' + index + '0412 201' + (index%9) + '05 1 00' + index,
                        assignedClass: acc.assignedClass || '',
                        assignedSubject: acc.assignedSubject || '',
                        password: acc.password 
                    });
                });
            }
        }

        function listenToCloudDatabase() {
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'sipandai06', 'appState');
            onSnapshot(docRef, (snap) => {
                UI.hideLoading();
                if (snap.exists()) {
                    const data = snap.data();
                    
                    if(data.grades) {
                        for(const k in data.grades) {
                            if(appState.grades[k] !== data.grades[k]) {
                                appState.grades[k] = data.grades[k];
                                const el = document.getElementById(`input_${k}`);
                                if(el && document.activeElement !== el) {
                                    el.value = data.grades[k];
                                    const parts = k.split('_'); 
                                    recalculateAverage(parts[0], parts[1]);
                                }
                                const nonEl = document.getElementById(`non_${k}`);
                                if(nonEl && document.activeElement !== nonEl) {
                                    nonEl.value = data.grades[k];
                                }
                            }
                        }
                    }

                    appState.students = data.students || appState.students;
                    
                    // ANTI-GAGAL: Jika teachers di Cloud kosong, isi pakai mock data
                    if (data.teachers && data.teachers.length > 0) {
                        appState.teachers = data.teachers;
                    } else {
                        initMocks();
                    }

                    appState.descriptions = data.descriptions || appState.descriptions;
                    appState.settings = data.settings || appState.settings;

                    if (!appState.settings.loginBg) appState.settings.loginBg = "https://images.unsplash.com/photo-1580582932707-520aed937b7b?q=80&w=2000";
                    if (!appState.settings.dashBg) appState.settings.dashBg = "https://images.unsplash.com/photo-1541339907198-e08756dedf3f?q=80&w=2000";
                    if (!appState.settings.mainLogo) appState.settings.mainLogo = "cropped-Logo-Tut-Wuri-Handayani-PNG-Warna-1.webp";
                    if (!appState.settings.kopLeftLogo) appState.settings.kopLeftLogo = "Lambang_Kota_Manado.jpg";
                    if (!appState.settings.kopRightLogo) appState.settings.kopRightLogo = "cropped-Logo-Tut-Wuri-Handayani-PNG-Warna-1.webp";

                    const loginBgEl = document.getElementById('login-screen-bg');
                    if(loginBgEl) loginBgEl.style.backgroundImage = `url('${appState.settings.loginBg}')`;
                    
                    const loginLogoEl = document.getElementById('login-main-logo');
                    if(loginLogoEl) loginLogoEl.src = appState.settings.mainLogo;

                    // Update UI jika user sudah login
                    if (appState.user) {
                        if(appState.currentView === 'data-siswa') loadStudentTable();
                        if(appState.currentView === 'data-guru') loadTeacherTable();
                        if(appState.currentView === 'dashboard') {
                            renderDashboard();
                            setTimeout(initDashboardCharts, 100);
                        }
                        if(appState.currentView === 'rekapitulasi') loadRekapTable();
                        if(appState.currentView === 'pengaturan') renderPengaturan();
                        
                        const currentT = appState.teachers.find(t => t.id === appState.user.username);
                        if (currentT && (currentT.profilePic !== appState.user.profilePic || currentT.name !== appState.user.name)) {
                            appState.user.profilePic = currentT.profilePic;
                            appState.user.name = currentT.name;
                            renderHeader();
                            if(appState.currentView === 'profil-akun') renderProfilAkun();
                        }
                        
                        const headerYearEl = document.getElementById('header-title-year');
                        if (headerYearEl) headerYearEl.innerText = `Tahun Ajaran ${appState.settings.academicYear}`;
                    }
                } else {
                    // Jika data belum pernah dibuat di cloud
                    initMocks();
                    saveDataToCloud();
                }
            }, (error) => {
                console.error("Snapshot error:", error);
                initMocks(); // Pastikan admin tetap bisa login jika terjadi error baca DB
                UI.hideLoading(); // ANTI-MACET: Paksa layar loading hilang jika terjadi error!
            });
        }

        let saveTimer;
        window.saveDataToCloud = () => {
            if (!db) return; // <-- PERBAIKAN: Hapus syarat ketat agar sistem lebih mudah menyimpan data
            
            const ind = document.getElementById('cloud-sync-indicator');
            if(ind) { ind.classList.remove('hidden'); ind.innerHTML = '<i class="fas fa-sync fa-spin text-blue-500"></i> Menyimpan...'; }
            
            clearTimeout(saveTimer);
            saveTimer = setTimeout(async () => {
                try {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'sipandai06', 'appState');
                    await setDoc(docRef, {
                        students: appState.students,
                        teachers: appState.teachers,
                        grades: appState.grades,
                        descriptions: appState.descriptions,
                        settings: appState.settings
                    });
                    if(ind) { 
                        ind.innerHTML = '<i class="fas fa-cloud-check text-emerald-500"></i> Tersimpan (Cloud)'; 
                        setTimeout(()=> ind.classList.add('hidden'), 2500); 
                    }
                } catch(e) {
                    console.error("Save error", e);
                    if(ind) { ind.innerHTML = '<i class="fas fa-exclamation-triangle text-red-500"></i> Gagal Simpan'; }
                    UI.toast("Gagal menyimpan! Buka web Firebase, lalu aktifkan 'Firestore Database (Test Mode)'.", "error"); // <-- TAMBAHAN: Peringatan merah yang jelas
                }
            }, 1000); 
        };

        const UI = {
            show: (id) => document.getElementById(id)?.classList.remove('hidden'),
            hide: (id) => document.getElementById(id)?.classList.add('hidden'),
            html: (id, html) => { if(document.getElementById(id)) document.getElementById(id).innerHTML = html; },
            val: (id, value) => { 
                const el = document.getElementById(id); 
                if(el) {
                    if(value !== undefined) el.value = value;
                    return el.value;
                }
                return null;
            },
            showLoading: () => UI.show('global-loader'),
            hideLoading: () => UI.hide('global-loader'),
            toast: (msg, type = 'success') => {
                const toast = document.createElement('div');
                toast.className = `fixed bottom-4 right-4 text-white px-6 py-3 rounded-lg shadow-lg transition-opacity duration-300 z-50 font-poppins ${type === 'success' ? 'bg-green-500' : 'bg-red-500'}`;
                toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'} mr-2"></i> ${msg}`;
                document.body.appendChild(toast);
                setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3000);
            },
            confirm: (msg, onConfirm) => {
                document.getElementById('custom-confirm-msg').innerHTML = msg;
                const btn = document.getElementById('custom-confirm-btn');
                btn.onclick = () => { UI.closeConfirm(); onConfirm(); };
                UI.show('custom-confirm-modal');
                document.getElementById('custom-confirm-modal').classList.add('flex');
            },
            closeConfirm: () => {
                UI.hide('custom-confirm-modal');
                document.getElementById('custom-confirm-modal').classList.remove('flex');
            }
        };

        window.editingTeacherId = null;
        window.changePasswordId = null; 
        window.editingStudentId = null;

        window.doLogin = () => {
            UI.showLoading();
            setTimeout(() => {
                const usernameInput = document.getElementById('login-username').value.toLowerCase().trim();
                const passwordInput = document.getElementById('login-password').value.trim();
                
                // ANTI-GAGAL: Jika belum ada data sama sekali (belum load dari cloud dll), inisiasi paksa!
                if (appState.teachers.length === 0) {
                    initMocks();
                }

                const accountInfo = appState.teachers.find(t => t.id === usernameInput);
                
                if (!accountInfo) {
                    UI.hideLoading(); UI.toast('Username tidak ditemukan di sistem!', 'error'); return;
                }
                if (accountInfo.password !== passwordInput) {
                    UI.hideLoading(); UI.toast('Kata sandi salah!', 'error'); return;
                }
                
                appState.user = { uid: accountInfo.id + '123', username: accountInfo.id, ...accountInfo };
                UI.hide('login-screen');
                UI.show('app-screen');
                initAppUI();
                UI.toast(`Selamat datang, ${accountInfo.name}`);
                UI.hideLoading();
            }, 800);
        };

        window.doLogout = () => {
            appState.user = null;
            UI.hide('app-screen');
            UI.show('login-screen');
            if(window.dashChart1) window.dashChart1.destroy();
            if(window.dashChart2) window.dashChart2.destroy();
            document.getElementById('login-form').reset();
        };

        function initAppUI() {
            renderSidebar();
            renderHeader();
            
            if (window.innerWidth < 1024) {
                appState.sidebarOpen = false;
                document.getElementById('sidebar').classList.add('-translate-x-full');
            } else {
                appState.sidebarOpen = true;
                document.getElementById('sidebar').classList.remove('-translate-x-full');
            }
            switchView('dashboard');
        }

        initCloudApp();

        window.switchView = (viewName) => {
            appState.currentView = viewName;
            document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.nav-item').forEach(el => {
                el.classList.remove('bg-slate-800', 'border-l-4', 'border-blue-500', 'text-blue-400');
                if(el.dataset.view === viewName) el.classList.add('bg-slate-800', 'border-l-4', 'border-blue-500', 'text-blue-400');
            });
            UI.show(`view-${viewName}`);
            
            if (viewName === 'dashboard') { 
                renderDashboard(); 
                if (appState.user) setTimeout(initDashboardCharts, 100); 
            }
            if (viewName === 'profil-akun') renderProfilAkun();
            if (viewName === 'data-siswa') renderDataSiswa();
            if (viewName === 'data-guru') renderDataGuru();
            if (viewName === 'pengaturan') renderPengaturan();
            if (viewName === 'input-nilai') renderInputNilai();
            if (viewName === 'rekapitulasi') renderRekapitulasi(); 
            if (viewName === 'non-akademik') renderNonAkademik();
            if (viewName === 'deskripsi') renderDeskripsi();
            if (viewName === 'rapot') renderRapot();

            closeSidebar();
        }

        window.toggleSidebar = () => {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            appState.sidebarOpen = !appState.sidebarOpen;
            
            if (appState.sidebarOpen) {
                sidebar.classList.remove('-translate-x-full');
                if (overlay) {
                    overlay.classList.remove('hidden');
                    setTimeout(() => overlay.classList.remove('opacity-0'), 10);
                }
            } else {
                sidebar.classList.add('-translate-x-full');
                if (overlay) {
                    overlay.classList.add('opacity-0');
                    setTimeout(() => overlay.classList.add('hidden'), 300);
                }
            }
        };

        window.closeSidebar = () => {
            if (window.innerWidth < 1024 && appState.sidebarOpen) {
                toggleSidebar();
            }
        };

        function renderSidebar() {
            let menuHtml = '';
            const navItem = (view, icon, text) => `
                <a href="#" onclick="switchView('${view}')" data-view="${view}" class="nav-item flex items-center px-6 py-3 text-slate-300 hover:bg-slate-800 hover:text-white transition-colors duration-200">
                    <i class="fas ${icon} w-6 text-center"></i><span class="mx-3 text-sm font-medium tracking-wide">${text}</span>
                </a>
            `;

                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 200; 
                    const MAX_HEIGHT = 200;
                    let width = img.width; 
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    } else {
                        if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                    }
                    
                    canvas.width = width; 
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
                    
                    appState.user.profilePic = dataUrl;
                    const teacherIndex = appState.teachers.findIndex(t => t.id === appState.user.username);
                    if(teacherIndex !== -1) {
                        appState.teachers[teacherIndex].profilePic = dataUrl;

                    saveDataToCloud();
                    renderHeader();
                    if(appState.currentView === 'profil-akun') renderProfilAkun();
                    UI.toast("Foto Profil berhasil diubah!", "success");
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        };

        window.initDashboardCharts = () => {
            if (!appState.user) return; 

            const role = appState.user.role;
            let targetStudents = appState.students;
            let titleDesc = "Seluruh Siswa di Sekolah";

            if (role === 'Wali Kelas') {
                targetStudents = targetStudents.filter(s => s.class === appState.user.assignedClass);
                titleDesc = `Siswa Kelas ${appState.user.assignedClass}`;
            } else if (role === 'Guru Mapel') {
                if (appState.user.assignedSubject === 'Pendidikan Agama Kristen & Budi Pekerti') {
                    targetStudents = targetStudents.filter(s => s.religion === 'Kristen');
                    titleDesc = "Seluruh Siswa Beragama Kristen";
                } else if (appState.user.assignedSubject === 'Pendidikan Agama Islam & Budi Pekerti') {
                    targetStudents = targetStudents.filter(s => s.religion === 'Islam');
                    titleDesc = "Seluruh Siswa Beragama Islam";
                } else {
                    titleDesc = `Siswa Mata Pelajaran ${appState.user.assignedSubject}`;
                }
            }

            const statTotalEl = document.getElementById('stat-total-siswa');
            if(statTotalEl) {
                statTotalEl.innerText = targetStudents.length;
                document.getElementById('stat-desc').innerText = titleDesc;
            }

            const classCounts = {};
            if(role === 'Wali Kelas') { classCounts[appState.user.assignedClass] = 0; }
            else { SCHOOL_DATA.classes.forEach(c => classCounts[c] = 0); }
            
            targetStudents.forEach(s => { if(classCounts[s.class] !== undefined) classCounts[s.class]++; });

            const relCounts = { 'Kristen': 0, 'Islam': 0, 'Katolik': 0, 'Hindu': 0, 'Buddha': 0, 'Lainnya': 0 };
            targetStudents.forEach(s => {
                if(relCounts[s.religion] !== undefined) relCounts[s.religion]++;
                else relCounts['Lainnya']++;
            });

            if(window.dashChart1) window.dashChart1.destroy();
            if(window.dashChart2) window.dashChart2.destroy();

            const ctx1 = document.getElementById('barChart');
            if(ctx1) {
                window.dashChart1 = new Chart(ctx1, {
                    type: 'bar',
                    data: {
                        labels: Object.keys(classCounts),
                        datasets: [{ label: 'Jumlah Siswa', data: Object.values(classCounts), backgroundColor: '#3b82f6', borderRadius: 4 }]
                    },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
                });
            }

            const ctx2 = document.getElementById('pieChart');
            if(ctx2) {
                window.dashChart2 = new Chart(ctx2, {
                    type: 'doughnut',
                    data: {
                        labels: ['Kristen', 'Islam', 'Katolik', 'Hindu', 'Buddha', 'Lainnya'],
                        datasets: [{ 
                            data: [relCounts['Kristen'], relCounts['Islam'], relCounts['Katolik'], relCounts['Hindu'], relCounts['Buddha'], relCounts['Lainnya']], 
                            backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#94a3b8'], borderWidth: 0 
                        }]
                    },
                    options: { responsive: true, maintainAspectRatio: false, cutout: '60%', plugins: { legend: { position: 'right', labels: { boxWidth: 12, font: { size: 10 } } } } }
                });
            }
        };

        window.showTeacherModal = (id = null) => {
            window.editingTeacherId = id;
            document.getElementById('form-teacher').reset();
            
            if(id) {
                const t = appState.teachers.find(x => x.id === id);
                if(t) {
                    UI.html('teacher-modal-title', '<i class="fas fa-user-edit mr-2"></i> Edit Data Guru');
                    document.getElementById('t-username').value = t.id;
                    document.getElementById('t-username').disabled = true;
                    document.getElementById('t-name').value = t.name;
                    document.getElementById('t-nip').value = t.nip;
                    document.getElementById('t-role').value = t.role;
                    if(t.assignedClass) document.getElementById('t-class').value = t.assignedClass;
                    if(t.assignedSubject) document.getElementById('t-subject').value = t.assignedSubject;
                }
            } else {
                UI.html('teacher-modal-title', '<i class="fas fa-user-plus mr-2"></i> Tambah Guru Baru');
                document.getElementById('t-username').disabled = false;
            }
            
            toggleTeacherRoleFields();
            UI.show('teacher-modal');
            document.getElementById('teacher-modal').classList.add('flex');
        };

        window.closeTeacherModal = () => {
            UI.hide('teacher-modal'); document.getElementById('teacher-modal').classList.remove('flex');
        };

        window.toggleTeacherRoleFields = () => {
            const role = UI.val('t-role');
            UI.hide('wrap-t-class'); UI.hide('wrap-t-subject');
            if(role === 'Wali Kelas') UI.show('wrap-t-class');
            else if(role === 'Guru Mapel') UI.show('wrap-t-subject');
        };

        window.saveTeacher = (e) => {
            e.preventDefault();
            const id = UI.val('t-username').toLowerCase().replace(/\s+/g, '_');
            const role = UI.val('t-role');
            
            if(window.editingTeacherId) {
                const idx = appState.teachers.findIndex(x => x.id === window.editingTeacherId);
                if(idx !== -1) {
                    appState.teachers[idx].name = UI.val('t-name');
                    appState.teachers[idx].nip = UI.val('t-nip');
                    appState.teachers[idx].role = role;
                    appState.teachers[idx].assignedClass = role === 'Wali Kelas' ? UI.val('t-class') : '';
                    appState.teachers[idx].assignedSubject = role === 'Guru Mapel' ? UI.val('t-subject') : '';
                }
                UI.toast('Data guru diperbarui ke Cloud!', 'success');
            } else {
                if(appState.teachers.find(x => x.id === id)) {
                    UI.toast('Username sudah dipakai! Pilih yang lain.', 'error'); return;
                }
                const newT = {
                    id: id, name: UI.val('t-name'), nip: UI.val('t-nip'), role: role,
                    assignedClass: role === 'Wali Kelas' ? UI.val('t-class') : '',
                    assignedSubject: role === 'Guru Mapel' ? UI.val('t-subject') : '',
                    password: '123' 
                };
                appState.teachers.push(newT);
                UI.toast('Guru baru ditambahkan ke Cloud!', 'success');
            }
            
            saveDataToCloud(); 
            closeTeacherModal();
            loadTeacherTable();
        };

        window.deleteTeacher = (id) => {
            if (id === 'admin') return; 
            UI.confirm(`Hapus permanen guru dengan username <b>${id}</b>?`, () => {
                appState.teachers = appState.teachers.filter(t => t.id !== id);
                saveDataToCloud(); 
                loadTeacherTable();
                UI.toast('Data Guru Terhapus dari Cloud', 'success');
            });
        };

            window.changePasswordId = id;
            document.getElementById('new-password-input').value = '';
            const t = appState.teachers.find(x => x.id === id);
            document.getElementById('password-modal-user').innerText = `Reset sandi untuk: ${t.name} (${t.id})`;
            UI.show('password-modal'); document.getElementById('password-modal').classList.add('flex');
        };

        window.closePasswordModal = () => {
            UI.hide('password-modal'); document.getElementById('password-modal').classList.remove('flex');
        };

        window.savePassword = (e) => {
            e.preventDefault();
            const newPass = document.getElementById('new-password-input').value.trim();
            if(newPass === '') { UI.toast('Kata sandi tidak boleh kosong!', 'error'); return; }
            
            const t = appState.teachers.find(x => x.id === window.changePasswordId);
            if(t) {
                t.password = newPass; 
                saveDataToCloud(); 
                UI.toast(`Kata sandi untuk ${t.id} berhasil diubah di Cloud!`, 'success');
            }
            closePasswordModal();
        };

            if(!tbody) return;

            if (appState.user.role === 'Guru Mapel') {
                if (appState.user.assignedSubject === 'Pendidikan Agama Kristen & Budi Pekerti') filtered = filtered.filter(s => s.religion === 'Kristen');

            if (searchQuery) filtered = filtered.filter(s => s.name.toLowerCase().includes(searchQuery) || s.nis.includes(searchQuery));

        window.downloadTemplateSiswa = () => {
            if(typeof XLSX === 'undefined') { UI.toast("Alat Excel sedang dimuat, mohon tunggu sebentar.", "error"); return; }
            const ws = XLSX.utils.json_to_sheet([
                { "Nama": "Jhon Doe", "NISN": "0012345678", "Kelas": "IA", "Agama": "Kristen" },
                { "Nama": "Siti Aminah", "NISN": "0012345679", "Kelas": "II", "Agama": "Islam" }
            ]);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "DataSiswa");
            XLSX.writeFile(wb, "Template_Data_Siswa.xlsx");
        };

        window.handleExcelSiswa = (e) => {
            const file = e.target.files[0];
            if(!file) return;
            UI.showLoading();
            const reader = new FileReader();
            reader.onload = (evt) => {
                try {
                    const data = evt.target.result;
                    const workbook = XLSX.read(data, {type: 'binary'});
                    const firstSheet = workbook.SheetNames[0];
                    const rows = XLSX.utils.sheet_to_json(workbook.Sheets[firstSheet]);
                    
                    let count = 0;
                    rows.forEach(row => {
                        const r = {};
                        for(let k in row) r[k.toString().toLowerCase().trim()] = row[k]; 
                        
                        const nama = r['nama'] || r['nama siswa'] || r['name'];
                        if(nama) {
                            appState.students.push({
                                id: 'S' + Math.random().toString(36).substr(2, 6).toUpperCase(),
                                name: nama,
                                nis: (r['nisn'] || r['nis'] || '-').toString(),
                                class: r['kelas'] || r['class'] || 'IA',
                                religion: r['agama'] || r['religion'] || 'Kristen'
                            });
                            count++;
                        }
                    });
                    
                    if(count > 0) {
                        saveDataToCloud();
                        loadStudentTable();
                        if(appState.currentView === 'dashboard' && appState.user) initDashboardCharts();
                        UI.toast(`Berhasil mengimpor ${count} data siswa!`, 'success');
                    } else {
                        UI.toast(`Gagal! Pastikan file Excel punya kolom "Nama", "NISN", "Kelas", "Agama"`, 'error');
                    }
                } catch(err) {
                    console.error(err);
                    UI.toast(`Terjadi kesalahan saat membaca file Excel.`, 'error');
                }
                UI.hideLoading();
                e.target.value = ''; 
            };
            reader.readAsBinaryString(file);
        };

        window.getNilaiAkhir = (sId, sub) => {
            let tpLmTot = 0, tpLmCnt = 0;
            for(let i=1; i<=12; i++) { let v = parseFloat(appState.grades[`${sId}_${sub}_tp${i}`]); if(!isNaN(v)){ tpLmTot+=v; tpLmCnt++; } }
            for(let i=1; i<=6; i++) { let v = parseFloat(appState.grades[`${sId}_${sub}_lm${i}`]); if(!isNaN(v)){ tpLmTot+=v; tpLmCnt++; } }

            let avgTPLM = tpLmCnt > 0 ? (tpLmTot / tpLmCnt) : null;
            let sts = parseFloat(appState.grades[`${sId}_${sub}_sts`]); let sas = parseFloat(appState.grades[`${sId}_${sub}_sas`]);

            let finalTot = 0, finalDiv = 0;
            if(avgTPLM !== null){ finalTot += avgTPLM; finalDiv++; }
            if(!isNaN(sts)){ finalTot += sts; finalDiv++; }
            if(!isNaN(sas)){ finalTot += sas; finalDiv++; }

            if(finalDiv > 0) {
                return Math.round(finalTot / finalDiv);
            }
            return '-';
        };

                if(isFaseA) availableSubjects = availableSubjects.filter(s => s !== 'IPAS' && s !== 'KKA (Koding dan Kecerdasan Artifisial)');

        window.recalculateAverage = (sId, sub) => {

            const cAvg = document.getElementById(`avg_${sId}_${subjId}`), cPred = document.getElementById(`pred_${sId}_${subjId}`), cKet = document.getElementById(`ket_${sId}_${subjId}`);
            
            if(cAvg && cPred && cKet) {
                if(avg !== '-') {
                    let pred = 'D', bg = 'text-red-700 bg-red-50';
                    if(avg>=90){ pred='A'; bg='text-green-700 bg-green-50'; } else if(avg>=80){ pred='B'; bg='text-blue-700 bg-blue-50'; } else if(avg>=70){ pred='C'; bg='text-yellow-700 bg-yellow-50'; }
                    
                    let desc = appState.descriptions[`${sub}_${pred}`] || `Capaian belajar siswa menunjukkan hasil yang ${pred === 'A' ? 'Sangat Baik' : pred === 'B' ? 'Baik' : pred === 'C' ? 'Cukup' : 'Perlu Bimbingan'} pada pelajaran {mapel}.`;
                    desc = desc.replace(/{mapel}/g, `<strong class="text-[10px] uppercase">${sub}</strong>`); 
                    
                    cAvg.innerText = avg; cAvg.className = `border p-2 text-center font-bold ${bg}`;
                    cPred.innerText = pred; cPred.className = `border p-2 text-center font-black ${bg}`;

        window.generateRapot = () => {
            const sId = UI.val('rapot-student'); const cls = UI.val('rapot-class');
            if(!sId) { UI.hide('rapot-preview'); return; }
            const student = appState.students.find(s => s.id === sId);
            
            const html = getSingleRapotHTML(student, cls);
            UI.html('rapot-preview', html);
            UI.show('rapot-preview');
        };

        window.downloadWordRapot = () => {
            const sId = UI.val('rapot-student'); const cls = UI.val('rapot-class');
            if(!sId) { UI.toast("Pilih siswa dan tampilkan rapot dulu!", "error"); return; }
            
            const student = appState.students.find(s => s.id === sId);
            const sel = document.getElementById('rapot-student');
            const studentName = sel.options[sel.selectedIndex].text.replace(/[^a-zA-Z0-9 ]/g, "");
            
            UI.toast("Mempersiapkan dokumen Word...", "success");
            
            let rapotContent = getSingleRapotHTML(student, cls);
            const preHtml = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>Rapot ${studentName}</title></head><body>`;
            const postHtml = "</body></html>";
            const html = preHtml + rapotContent + postHtml;

            const blob = new Blob(['\ufeff', html], {
                type: 'application/msword'
            });
            
            const url = 'data:application/vnd.ms-word;charset=utf-8,' + encodeURIComponent(html);
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `Rapot_${studentName}.doc`;
            
            document.body.appendChild(link);
            if (navigator.msSaveOrOpenBlob) {
                navigator.msSaveOrOpenBlob(blob, `Rapot_${studentName}.doc`);
            } else {
                link.click(); 
            }
            document.body.removeChild(link);
            UI.toast("Berhasil mengunduh dokumen Word!", "success");
        };

        window.printRapot = () => {
            const el = document.getElementById('rapot-preview');
            if(!el || el.classList.contains('hidden') || el.innerHTML.trim() === '') { 
                UI.toast("Pilih siswa dan tampilkan rapot dulu!", "error"); return; 
            }
            const sel = document.getElementById('rapot-student');
            const studentName = sel.options[sel.selectedIndex].text.replace(/[^a-zA-Z0-9 ]/g, "");
            
            UI.toast("Sedang memproses PDF Rapot Legal...", "success");
            const opt = {
              margin:       0,
              filename:     `Rapot_${studentName}.pdf`,
              image:        { type: 'jpeg', quality: 0.98 },
              html2canvas:  { scale: 2 },
              jsPDF:        { unit: 'mm', format: 'legal', orientation: 'portrait' }
            };
            html2pdf().set(opt).from(el).save().then(() => UI.toast("Rapot PDF berhasil diunduh!", "success"));
        };

        window.printAllRapot = () => {
            const cls = UI.val('rapot-class');
            if(!cls) { UI.toast("Pilih kelas terlebih dahulu!", "error"); return; }
            
            const stds = appState.students.filter(s => s.class === cls);
            if(stds.length === 0) { UI.toast("Tidak ada data siswa di kelas ini.", "error"); return; }
            
            UI.toast(`Sedang merakit Rapot Legal untuk ${stds.length} siswa kelas ${cls}...`, "success");
            
            let allHtml = '<div style="background: white; color: black; width: 100%;">';
            stds.forEach((s, index) => {
                allHtml += getSingleRapotHTML(s, cls);
                if (index < stds.length - 1) {
                    allHtml += '<div class="html2pdf__page-break"></div>';
                }
            });
            allHtml += '</div>';
            
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = allHtml;
            
            const opt = {
              margin:       0,
              filename:     `Semua_Rapot_Kelas_${cls}.pdf`,
              image:        { type: 'jpeg', quality: 0.98 },
              html2canvas:  { scale: 2 },
              jsPDF:        { unit: 'mm', format: 'legal', orientation: 'portrait' }
            };
            
            html2pdf().set(opt).from(tempDiv).save().then(() => {
                UI.toast(`Semua Rapot Kelas ${cls} Berhasil Diunduh!`, "success");
            });
        };
    </script>

            <div class="p-4 border-t border-slate-800"><button onclick="doLogout()" class="w-full p-3 bg-red-500/20 hover:bg-red-500/40 text-red-400 hover:text-white rounded-lg text-sm font-bold transition font-poppins"><i class="fas fa-power-off mr-2"></i> KELUAR APLIKASI</button></div>
        </aside>

        <div id="main-content" class="flex-1 flex flex-col h-screen overflow-hidden relative w-full">
            <header class="bg-white shadow-sm border-b h-16 flex items-center justify-between px-4 sm:px-6 z-20 sticky top-0 no-print">
                <div class="flex items-center">
                    <button onclick="toggleSidebar()" class="mr-3 sm:mr-4 text-slate-600 hover:bg-slate-100 p-2 rounded-md lg:hidden"><i class="fas fa-bars text-lg"></i></button>
                    <div class="hidden sm:block">
                        <h1 id="header-title-year" class="text-sm font-bold text-slate-800 font-poppins">Tahun Ajaran 2026/2027</h1>
                    </div>
                </div>
                <div id="header-user-info" class="flex items-center bg-slate-50 px-3 py-1.5 rounded-full border font-poppins"></div>
            </header>

            <main class="flex-1 overflow-x-hidden overflow-y-auto p-4 md:p-8">
                <div id="view-dashboard" class="view-section animate-fade-in max-w-7xl mx-auto"></div>
                <div id="view-profil-akun" class="view-section hidden animate-fade-in max-w-4xl mx-auto"></div>
                <div id="view-data-siswa" class="view-section hidden animate-fade-in max-w-7xl mx-auto"></div>
                <div id="view-data-guru" class="view-section hidden animate-fade-in max-w-7xl mx-auto"></div>
                <div id="view-pengaturan" class="view-section hidden animate-fade-in max-w-7xl mx-auto"></div>
                <div id="view-input-nilai" class="view-section hidden animate-fade-in max-w-[95%] mx-auto"></div>
                <div id="view-rekapitulasi" class="view-section hidden animate-fade-in max-w-[95%] mx-auto"></div> 
                <div id="view-non-akademik" class="view-section hidden animate-fade-in max-w-7xl mx-auto"></div>
                <div id="view-deskripsi" class="view-section hidden animate-fade-in max-w-7xl mx-auto"></div>
                <div id="view-rapot" class="view-section hidden animate-fade-in max-w-7xl mx-auto"></div>
            </main>
        </div>
    </div>
    
    <input type="file" id="profile-upload" accept="image/*" class="hidden" onchange="handleProfileUpload(event)">
    <input type="file" id="excel-upload-siswa" accept=".xlsx, .xls, .csv" class="hidden" onchange="handleExcelSiswa(event)">
</body>
