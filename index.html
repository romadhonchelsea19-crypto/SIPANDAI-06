    <style>

        /* Custom Scrollbar */

        .table-container::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out; }
        
        @keyframes pulseGlow {
            0% { filter: drop-shadow(0 0 10px rgba(59, 130, 246, 0.4)); transform: scale(1); }
            50% { filter: drop-shadow(0 0 30px rgba(255, 255, 255, 1)) drop-shadow(0 0 40px rgba(59, 130, 246, 0.9)); transform: scale(1.05); }
            100% { filter: drop-shadow(0 0 10px rgba(59, 130, 246, 0.4)); transform: scale(1); }
        }
        .animate-logo-glow { animation: pulseGlow 2.5s infinite ease-in-out; }

        #sidebar { transition: transform 0.3s ease-in-out; z-index: 50; }
        #sidebar-overlay { z-index: 40; }

        .glass-dark { 
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(59, 130, 246, 0.3);
            box-shadow: 0 0 40px rgba(0,0,0,0.6), 0 0 15px rgba(59,130,246,0.25);
        }
        .text-glow-blue { text-shadow: 0 0 10px rgba(59, 130, 246, 0.8), 0 0 20px rgba(59, 130, 246, 0.4); }
        .input-glow:focus { box-shadow: 0 0 15px rgba(59, 130, 246, 0.6); border-color: #3b82f6 !important; }
        
        @media print {
            body { background: white !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            body * { visibility: hidden !important; }
            body.printing-rapot #rapot-preview, body.printing-rapot #rapot-preview * { visibility: visible !important; }
            body.printing-rapot #rapot-preview { 
                position: absolute !important; left: 0 !important; top: 0 !important; width: 100% !important; 
                border: none !important; box-shadow: none !important; padding: 10px !important; margin: 0 !important; background: white !important;
            }
            aside, header, button, .no-print { display: none !important; }

<body class="text-gray-800 h-screen overflow-hidden flex flex-col">

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const SCHOOL_DATA = {
            classes: ['IA', 'IB', 'II', 'IIIA', 'IIIB', 'IIIC', 'IVA', 'IVB', 'IVC', 'VA', 'VB', 'VC', 'VIA', 'VIB', 'VIC'],
            subjects: [
                'Pendidikan Agama Kristen & Budi Pekerti', 
                'Pendidikan Agama Islam & Budi Pekerti', 
                'Pendidikan Pancasila', 
                'Bahasa Indonesia', 
                'Matematika', 
                'IPAS', 
                'Seni Musik/Rupa', 
                'PJOK', 
                'Bahasa Inggris', 
                'KKA (Koding dan Kecerdasan Artifisial)'
            ]
        };

        const MAPEL_BIDANG_STUDI = [
            'Pendidikan Agama Kristen & Budi Pekerti', 'Pendidikan Agama Islam & Budi Pekerti', 
            'PJOK', 'Bahasa Inggris', 'KKA (Koding dan Kecerdasan Artifisial)'
        ];
        const MAPEL_WALI_KELAS = SCHOOL_DATA.subjects.filter(s => !MAPEL_BIDANG_STUDI.includes(s));

        window.appState = {
            user: null, currentView: 'dashboard', students: [], teachers: [], grades: {}, descriptions: {}, thresholds: {}, sidebarOpen: false,
            settings: {
                schoolName: "SD NEGERI 06 MANADO", schoolAddress: "Jl. Sarapung No 24 Kec. Wenang Utara Kota Manado", academicYear: "2026/2027", semester: "Ganjil",
                headmasterName: "Dr. Dra. Hj. Fatimah M., M.Pd", headmasterNip: "19750817 199903 1 005", printDate: "Manado, 18 Desember 2026",
                loginBg: "https://images.unsplash.com/photo-1580582932707-520aed937b7b?q=80&w=2000", dashBg: "https://images.unsplash.com/photo-1541339907198-e08756dedf3f?q=80&w=2000",
                mainLogo: "cropped-Logo-Tut-Wuri-Handayani-PNG-Warna-1.webp", kopLeftLogo: "Lambang_Kota_Manado.jpg", kopRightLogo: "cropped-Logo-Tut-Wuri-Handayani-PNG-Warna-1.webp"
            }
        };

        const demoAccounts = {
            'kepsek': { role: 'Kepsek', name: 'Dr. Dra. Hj. Fatimah M., M.Pd', password: '123' },
            'admin': { role: 'Admin', name: 'Administrator System', password: '123' },
            'wali_1a': { role: 'Wali Kelas', name: 'Guru Wali 1A', assignedClass: 'IA', password: '123' },
            'mapel_pjok': { role: 'Guru Mapel', name: 'Guru PJOK', assignedSubject: 'PJOK', password: '123' }
        };

        const appId = 'sipandai-06-36543'; 
        const firebaseConfig = {
            apiKey: "AIzaSyAxXMEiorBbQoJO2YqW4TWdNm33X0lNsjY", authDomain: "sipandai-06-36543.firebaseapp.com",
            projectId: "sipandai-06-36543", storageBucket: "sipandai-06-36543.firebasestorage.app",
            messagingSenderId: "760127633818", appId: "1:760127633818:web:1ae67b75927bc1ed45e223", measurementId: "G-9H4XRH5K5G"
        };
        
        let app, db, auth;
        if (firebaseConfig) { app = initializeApp(firebaseConfig); db = getFirestore(app); auth = getAuth(app); }

        async function initCloudApp() {
            UI.showLoading();
            setTimeout(() => { UI.hideLoading(); }, 5000);

            if (!auth) { initMocks(); UI.hideLoading(); return; }
            try {
                await signInAnonymously(auth);
                listenToCloudDatabase();
            } catch (e) {
                console.error("Auth Cloud Error", e);
                initMocks(); listenToCloudDatabase(); 
            }
        }

        function initMocks() {
            if (appState.teachers.length === 0) {
                Object.keys(demoAccounts).forEach((key, index) => {
                    let acc = demoAccounts[key];
                    appState.teachers.push({
                        id: key, name: acc.name, role: acc.role, nip: '198' + index + '0412 201' + (index%9) + '05 1 00' + index,
                        assignedClass: acc.assignedClass || '', assignedSubject: acc.assignedSubject || '', password: acc.password 
                    });
                });
            }
        }

        function listenToCloudDatabase() {
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'sipandai06', 'appState');
            onSnapshot(docRef, (snap) => {
                UI.hideLoading();
                if (snap.exists()) {
                    const data = snap.data();
                    if(data.grades) {
                        for(const k in data.grades) {
                            if(appState.grades[k] !== data.grades[k]) {
                                appState.grades[k] = data.grades[k];
                                const el = document.getElementById(`input_${k}`);
                                if(el && document.activeElement !== el) {
                                    el.value = data.grades[k];
                                    const parts = k.split('_'); recalculateAverage(parts[0], parts[1]);
                                }
                            }
                        }
                    }

                    appState.students = data.students || appState.students;
                    if (data.teachers && data.teachers.length > 0) appState.teachers = data.teachers; else initMocks();
                    appState.descriptions = data.descriptions || appState.descriptions;
                    appState.thresholds = data.thresholds || appState.thresholds;
                    appState.settings = data.settings || appState.settings;

                    if (!appState.settings.loginBg) appState.settings.loginBg = "https://images.unsplash.com/photo-1580582932707-520aed937b7b?q=80&w=2000";
                    if (!appState.settings.dashBg) appState.settings.dashBg = "https://images.unsplash.com/photo-1541339907198-e08756dedf3f?q=80&w=2000";
                    if (!appState.settings.mainLogo) appState.settings.mainLogo = "cropped-Logo-Tut-Wuri-Handayani-PNG-Warna-1.webp";
                    if (!appState.settings.kopLeftLogo) appState.settings.kopLeftLogo = "Lambang_Kota_Manado.jpg";
                    if (!appState.settings.kopRightLogo) appState.settings.kopRightLogo = "cropped-Logo-Tut-Wuri-Handayani-PNG-Warna-1.webp";

                    const loginBgEl = document.getElementById('login-screen-bg');
                    if(loginBgEl) loginBgEl.style.backgroundImage = `url('${appState.settings.loginBg}')`;
                    const loginLogoEl = document.getElementById('login-main-logo');
                    if(loginLogoEl) loginLogoEl.src = appState.settings.mainLogo;

                    if (appState.user) {
                        if(appState.currentView === 'data-siswa') loadStudentTable();
                        if(appState.currentView === 'data-guru') loadTeacherTable();
                        if(appState.currentView === 'dashboard') { renderDashboard(); setTimeout(initDashboardCharts, 100); }
                        if(appState.currentView === 'rekapitulasi') loadRekapTable();
                        if(appState.currentView === 'pengaturan') renderPengaturan();
                        
                        const currentT = appState.teachers.find(t => t.id === appState.user.username);
                        if (currentT && (currentT.profilePic !== appState.user.profilePic || currentT.name !== appState.user.name)) {
                            appState.user.profilePic = currentT.profilePic; appState.user.name = currentT.name; renderHeader();
                        }
                    }
                } else { initMocks(); saveDataToCloud(); }
            }, (error) => { console.error("Snapshot error:", error); initMocks(); });
        }

        let saveTimer;
        window.saveDataToCloud = () => {
            if (!db) return; 
            const ind = document.getElementById('cloud-sync-indicator');
            if(ind) { ind.classList.remove('hidden'); ind.innerHTML = '<i class="fas fa-sync fa-spin text-blue-500"></i> Menyimpan...'; }
            
            clearTimeout(saveTimer);
            saveTimer = setTimeout(async () => {
                try {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'sipandai06', 'appState');
                    await setDoc(docRef, {
                        students: appState.students, teachers: appState.teachers, grades: appState.grades,
                        descriptions: appState.descriptions, thresholds: appState.thresholds, settings: appState.settings
                    });
                    if(ind) { ind.innerHTML = '<i class="fas fa-cloud-check text-emerald-500"></i> Tersimpan (Cloud)'; setTimeout(()=> ind.classList.add('hidden'), 2500); }
                } catch(e) {
                    console.error("Save error", e);
                    if(ind) { ind.innerHTML = '<i class="fas fa-exclamation-triangle text-red-500"></i> Gagal Simpan'; }
                    UI.toast("Gagal menyimpan! Periksa memori gambar atau jaringan.", "error"); 
                }
            }, 1000); 
        };

        const UI = {
            show: (id) => document.getElementById(id)?.classList.remove('hidden'), hide: (id) => document.getElementById(id)?.classList.add('hidden'),
            html: (id, html) => { if(document.getElementById(id)) document.getElementById(id).innerHTML = html; },
            val: (id, value) => { const el = document.getElementById(id); if(el) { if(value !== undefined) el.value = value; return el.value; } return null; },
            showLoading: () => UI.show('global-loader'), hideLoading: () => UI.hide('global-loader'),
            toast: (msg, type = 'success') => {
                const toast = document.createElement('div');
                toast.className = `fixed bottom-4 right-4 text-white px-6 py-3 rounded-lg shadow-lg transition-opacity duration-300 z-50 font-poppins ${type === 'success' ? 'bg-green-500' : 'bg-red-500'}`;
                toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'} mr-2"></i> ${msg}`;
                document.body.appendChild(toast); setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3000);
            },
            confirm: (msg, onConfirm) => {
                document.getElementById('custom-confirm-msg').innerHTML = msg;
                const btn = document.getElementById('custom-confirm-btn'); btn.onclick = () => { UI.closeConfirm(); onConfirm(); };
                UI.show('custom-confirm-modal'); document.getElementById('custom-confirm-modal').classList.add('flex');
            },
            closeConfirm: () => { UI.hide('custom-confirm-modal'); document.getElementById('custom-confirm-modal').classList.remove('flex'); }
        };

        window.editingTeacherId = null; window.changePasswordId = null; window.editingStudentId = null;

        window.doLogin = () => {
            UI.showLoading();
            setTimeout(() => {
                const usernameInput = document.getElementById('login-username').value.toLowerCase().trim();
                const passwordInput = document.getElementById('login-password').value.trim();
                if (appState.teachers.length === 0) initMocks();

                const accountInfo = appState.teachers.find(t => t.id === usernameInput);
                if (!accountInfo) { UI.hideLoading(); UI.toast('Username tidak ditemukan di sistem!', 'error'); return; }
                if (accountInfo.password !== passwordInput) { UI.hideLoading(); UI.toast('Kata sandi salah!', 'error'); return; }
                
                appState.user = { uid: accountInfo.id + '123', username: accountInfo.id, ...accountInfo };
                UI.hide('login-screen'); UI.show('app-screen'); initAppUI();
                UI.toast(`Selamat datang, ${accountInfo.name}`); UI.hideLoading();
            }, 800);
        };

        window.doLogout = () => {
            appState.user = null; UI.hide('app-screen'); UI.show('login-screen');
            if(window.dashChart1) window.dashChart1.destroy(); if(window.dashChart2) window.dashChart2.destroy();
            document.getElementById('login-form').reset();
        };

        function initAppUI() {
            renderSidebar(); renderHeader();
            if (window.innerWidth < 1024) { appState.sidebarOpen = false; document.getElementById('sidebar').classList.add('-translate-x-full'); } 
            else { appState.sidebarOpen = true; document.getElementById('sidebar').classList.remove('-translate-x-full'); }
            switchView('dashboard');
        }

        initCloudApp();

        window.switchView = (viewName) => {
            appState.currentView = viewName;
            document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.nav-item').forEach(el => {
                el.classList.remove('bg-slate-800', 'border-l-4', 'border-blue-500', 'text-blue-400');
                if(el.dataset.view === viewName) el.classList.add('bg-slate-800', 'border-l-4', 'border-blue-500', 'text-blue-400');
            });
            UI.show(`view-${viewName}`);
            
            if (viewName === 'dashboard') { renderDashboard(); if (appState.user) setTimeout(initDashboardCharts, 100); }
            if (viewName === 'profil-akun') renderProfilAkun();
            if (viewName === 'data-siswa') renderDataSiswa();
            if (viewName === 'data-guru') renderDataGuru();
            if (viewName === 'pengaturan') renderPengaturan();
            if (viewName === 'input-nilai') renderInputNilai();
            if (viewName === 'nilai-keaktifan') renderNilaiKeaktifan(); 
            if (viewName === 'nilai-sikap') renderNilaiSikap(); 
            if (viewName === 'ambang-batas') renderAmbangBatas();
            if (viewName === 'rekapitulasi') renderRekapitulasi(); 
            if (viewName === 'non-akademik') renderNonAkademik();
            if (viewName === 'deskripsi') renderDeskripsi();
            if (viewName === 'rapot') renderRapot();

            closeSidebar();
        }

        window.toggleSidebar = () => {
            const sidebar = document.getElementById('sidebar'); const overlay = document.getElementById('sidebar-overlay');
            appState.sidebarOpen = !appState.sidebarOpen;
            if (appState.sidebarOpen) { sidebar.classList.remove('-translate-x-full'); if (overlay) { overlay.classList.remove('hidden'); setTimeout(() => overlay.classList.remove('opacity-0'), 10); } } 
            else { sidebar.classList.add('-translate-x-full'); if (overlay) { overlay.classList.add('opacity-0'); setTimeout(() => overlay.classList.add('hidden'), 300); } }
        };

        window.closeSidebar = () => { if (window.innerWidth < 1024 && appState.sidebarOpen) toggleSidebar(); };

        function renderSidebar() {
            let menuHtml = '';
            const navItem = (view, icon, text) => `
                <a href="#" onclick="switchView('${view}')" data-view="${view}" class="nav-item flex items-center px-6 py-3 text-slate-300 hover:bg-slate-800 hover:text-white transition-colors duration-200">
                    <i class="fas ${icon} w-6 text-center"></i><span class="mx-3 text-sm font-medium tracking-wide">${text}</span>
                </a>
            `;

            menuHtml += navItem('dashboard', 'fa-chart-pie', 'Dashboard Utama');
            menuHtml += navItem('profil-akun', 'fa-user-shield', 'Profil & Keamanan'); 
            menuHtml += navItem('data-siswa', 'fa-users', 'Data Siswa');
            if (appState.user.role === 'Admin') { menuHtml += navItem('data-guru', 'fa-chalkboard-teacher', 'Data Guru (Admin)'); menuHtml += navItem('pengaturan', 'fa-cogs', 'Pengaturan Sistem'); }
            
            menuHtml += navItem('input-nilai', 'fa-edit', 'Nilai Akademik');
            menuHtml += navItem('nilai-keaktifan', 'fa-hand-paper', 'Nilai Keaktifan'); 
            menuHtml += navItem('nilai-sikap', 'fa-heart', 'Penilaian Sikap'); 
            
            menuHtml += navItem('ambang-batas', 'fa-sliders-h', 'Nilai Ambang Batas');
            if (appState.user.role !== 'Guru Mapel') menuHtml += navItem('rekapitulasi', 'fa-clipboard-list', 'Rekapitulasi Nilai');
            menuHtml += navItem('deskripsi', 'fa-comment-dots', 'Master Deskripsi');
            if (appState.user.role !== 'Guru Mapel') { menuHtml += navItem('non-akademik', 'fa-clipboard-check', 'Kehadiran & Ekstra'); menuHtml += navItem('rapot', 'fa-book-open', 'E-Rapot'); }
            UI.html('sidebar-menu', menuHtml);
        }

        function renderHeader() {
            let roleText = appState.user.role;
            if (appState.user.assignedClass) roleText += ` (${appState.user.assignedClass})`;
            if (appState.user.assignedSubject) roleText += ` (${appState.user.assignedSubject})`;
            
            let profileContent = appState.user.profilePic ? `<img src="${appState.user.profilePic}" alt="Profile" class="h-full w-full object-cover rounded-full">` : `${appState.user.name.charAt(0)}`;
            UI.html('header-user-info', `
                <div id="cloud-sync-indicator" class="hidden mr-4 text-[10px] font-bold text-gray-500 flex items-center gap-1.5 bg-slate-100 px-3 py-1.5 rounded-full shadow-inner border font-poppins"></div>
                <div class="text-right mr-4 hidden sm:block"><p class="text-sm font-bold text-gray-800">${appState.user.name}</p><p class="text-xs text-gray-500">${roleText}</p></div>
                <div onclick="document.getElementById('profile-upload').click()" class="h-9 w-9 rounded-full bg-slate-900 flex items-center justify-center text-blue-400 font-bold shadow-md ring-2 ring-slate-100 uppercase cursor-pointer hover:ring-blue-400 transition relative group overflow-hidden" title="Klik untuk ubah foto profil">
                    ${profileContent} <div class="absolute inset-0 bg-black/60 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity"><i class="fas fa-camera text-white text-[10px]"></i></div>
                </div>
            `);
            const headerYearEl = document.getElementById('header-title-year'); if (headerYearEl) headerYearEl.innerText = `Tahun Ajaran ${appState.settings.academicYear}`;
        }

        window.getKeaktifanAvg = (sId, sub) => {
            const fields = ['bertanya', 'menjawab', 'memperhatikan', 'kerjasama', 'mencatat'];
            let tot = 0, cnt = 0;
            fields.forEach(f => {
                let v = parseFloat(appState.grades[`${sId}_${sub}_aktif_${f}`]);
                if(!isNaN(v)) { tot += v; cnt++; }
            });
            return cnt > 0 ? Math.round(tot / cnt) : null;
        };

        window.getSikapAvg = (sId, sub) => {
            const fields = ['disiplin', 'tanggungjawab', 'jujur', 'peduli', 'kesopanan'];
            let tot = 0, cnt = 0;
            fields.forEach(f => {
                let v = parseFloat(appState.grades[`${sId}_${sub}_sikap_${f}`]);
                if(!isNaN(v)) { tot += v; cnt++; }
            });
            return cnt > 0 ? Math.round(tot / cnt) : null;
        };

        window.getNilaiAkhir = (sId, sub) => {
            let tpLmTot = 0, tpLmCnt = 0;
            for(let i=1; i<=11; i++) { let v = parseFloat(appState.grades[`${sId}_${sub}_tp${i}`]); if(!isNaN(v)){ tpLmTot+=v; tpLmCnt++; } }
            for(let i=1; i<=6; i++) { let v = parseFloat(appState.grades[`${sId}_${sub}_lm${i}`]); if(!isNaN(v)){ tpLmTot+=v; tpLmCnt++; } }

            let avgTPLM = tpLmCnt > 0 ? (tpLmTot / tpLmCnt) : null;
            let sts = parseFloat(appState.grades[`${sId}_${sub}_sts`]); 
            let sas = parseFloat(appState.grades[`${sId}_${sub}_sas`]);
            let praktek = parseFloat(appState.grades[`${sId}_${sub}_praktek`]);
            let keaktifan = getKeaktifanAvg(sId, sub);
            let sikap = getSikapAvg(sId, sub);

            let finalTot = 0, finalDiv = 0;
            if(avgTPLM !== null){ finalTot += avgTPLM; finalDiv++; }
            if(!isNaN(sts)){ finalTot += sts; finalDiv++; }
            if(!isNaN(sas)){ finalTot += sas; finalDiv++; }
            if(!isNaN(praktek)){ finalTot += praktek; finalDiv++; }
            if(keaktifan !== null){ finalTot += keaktifan; finalDiv++; }
            if(sikap !== null){ finalTot += sikap; finalDiv++; }

            if(finalDiv > 0) {
                let finalScore = Math.round(finalTot / finalDiv);
                
                const student = appState.students.find(s => s.id === sId);
                if (student) {
                    const cls = student.class;

        window.handleImageSetting = (event, settingKey) => {
            const file = event.target.files[0]; if (!file) return;
            if (!file.type.match('image.*')) { UI.toast("File harus berupa gambar!", "error"); return; }
            
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas'); 
                    
                    // --- PERBAIKAN LOGIKA KOMPRESI AGAR TIDAK ERROR 1MB ---
                    let MAX_SIZE = 1000;
                    let mimeType = 'image/png';
                    let quality = 0.92; // Hanya berlaku untuk JPEG

                    if (settingKey === 'loginBg' || settingKey === 'dashBg') {
                        MAX_SIZE = 800; // Background cukup 800px untuk layar standar, agar ukurannya kecil
                        mimeType = 'image/jpeg'; // Background WAJIB JPEG agar super kecil ukurannya
                        quality = 0.6; // Kompresi 60%
                    } else {
                        MAX_SIZE = 300; // Logo dikecilkan jadi 300px (sudah sangat tajam untuk ukuran rapot)
                        mimeType = 'image/png'; // Pertahankan PNG agar pinggirannya tetap transparan
                    }

                    let w = img.width, h = img.height;
                    
                    if (w > h) { if (w > MAX_SIZE) { h *= MAX_SIZE / w; w = MAX_SIZE; } } 
                    else { if (h > MAX_SIZE) { w *= MAX_SIZE / h; h = MAX_SIZE; } }
                    
                    canvas.width = w; canvas.height = h; 
                    const ctx = canvas.getContext('2d'); 
                    
                    // Khusus JPEG, beri warna dasar putih (kalau gambar asli transparan, biar tidak jadi hitam)
                    if (mimeType === 'image/jpeg') {
                        ctx.fillStyle = "#ffffff";
                        ctx.fillRect(0, 0, w, h);
                    }

                    ctx.drawImage(img, 0, 0, w, h);
                    
                    // Convert ke format base64 sesuai mimeType (JPEG atau PNG)
                    const dataUrl = canvas.toDataURL(mimeType, quality);
                    
                    if(settingKey === 'loginBg') {
                        document.getElementById('set-login-bg').value = dataUrl;
                    } else if (settingKey === 'dashBg') {
                        document.getElementById('set-dash-bg').value = dataUrl;
                    } else {
                        appState.settings[settingKey] = dataUrl;
                        renderPengaturan(); // Render ulang agar logo barunya langsung terlihat di pratinjau
                    }
                    
                    UI.toast("Foto berhasil dimuat. Klik tombol 'Simpan Semua' di bawah!", "success");
                }; 
                img.src = e.target.result;
            }; 
            reader.readAsDataURL(file);
        };

                <div class="flex justify-between mb-6 no-print"><h2 class="text-2xl font-bold font-russo tracking-wide">E-Rapot Akademik</h2><div class="flex gap-2"><button onclick="downloadWordRapot()" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-semibold"><i class="fas fa-file-word"></i> Word</button><button onclick="printRapot()" class="bg-red-600 text-white px-4 py-2 rounded-lg font-semibold"><i class="fas fa-print"></i> Cetak PDF (1)</button><button onclick="printAllRapot()" class="bg-purple-600 text-white px-4 py-2 rounded-lg font-semibold"><i class="fas fa-layer-group"></i> Semua PDF</button></div></div>
                <div class="bg-white p-4 rounded-xl border mb-6 flex gap-4 no-print"><select id="rapot-class" onchange="loadRapotStds()" class="w-1/2 border p-2 font-bold">${classOptions}</select><select id="rapot-student" onchange="generateRapot()" class="w-1/2 border p-2 font-bold text-blue-900" disabled><option value="">Pilih Kelas</option></select></div>
                <div id="rapot-export-container" class="overflow-x-auto w-full"><div id="rapot-preview" class="bg-white shadow-2xl border hidden text-black min-w-[800px]" style="font-family: 'Times New Roman', Times, serif; max-width: 800px; margin: 0 auto; line-height: 1.5; color: black !important;"></div></div>
            `;
            UI.html('view-rapot', content); if(appState.user && appState.user.role === 'Wali Kelas') loadRapotStds();
        }

        window.loadRapotStds = () => {
            const cls = UI.val('rapot-class'); const sel = document.getElementById('rapot-student');
            if(!cls){ sel.innerHTML='<option value="">Pilih Kelas</option>'; sel.disabled=true; UI.hide('rapot-preview'); return; }
            let html = '<option value="">-- Pilih Siswa --</option>'; appState.students.filter(s => s.class === cls).forEach(s => html += `<option value="${s.id}">${s.name}</option>`); sel.innerHTML = html; sel.disabled = false;
        };

        window.getSingleRapotHTML = (student, cls) => {
            const sId = student.id; let gradesHtml = ''; let idx = 1;
            const isFaseA = ['IA', 'IB', 'II'].includes(cls); const isFaseB = ['IIIA', 'IIIB', 'IIIC', 'IVA', 'IVB', 'IVC'].includes(cls);
            
            SCHOOL_DATA.subjects.forEach((sub) => {
                if (sub === 'Pendidikan Agama Kristen & Budi Pekerti' && student.religion !== 'Kristen') return;
                if (sub === 'Pendidikan Agama Islam & Budi Pekerti' && student.religion !== 'Islam') return;
                if (sub === 'IPAS' && isFaseA) return; if (sub === 'KKA (Koding dan Kecerdasan Artifisial)' && (isFaseA || isFaseB)) return;

                let score = getNilaiAkhir(sId, sub); let pred = 'D'; 
                if(score !== '-') { if(score>=90) pred='A'; else if(score>=80) pred='B'; else if(score>=70) pred='C'; } else { pred = '-'; }
                let desc = pred!=='-' ? (appState.descriptions[`${sub}_${cls}_${pred}`] || appState.descriptions[`${sub}_${pred}`] || `Capaian baik pada ${sub}.`) : 'Belum ada penilaian.';
                gradesHtml += `<tr><td style="border:1px solid black; padding:6px; text-align:center;">${idx++}</td><td style="border:1px solid black; padding:6px; font-weight:bold;">${sub}</td><td style="border:1px solid black; padding:6px; text-align:center;">${score}</td><td style="border:1px solid black; padding:6px; text-align:center; font-weight:bold;">${pred}</td><td style="border:1px solid black; padding:6px; font-size:12px; text-align:justify;">${desc}</td></tr>`;
            });
            
            const val = (f) => {
                let v = appState.grades[`${sId}_${f}`];
                if (v === undefined || v === null || v === '') {
                    return (f === 'catatan') ? '' : '-';
                }
                return v;
            };
            const waliData = appState.teachers.find(t => t.role === 'Wali Kelas' && t.assignedClass === cls);
            
            return `
                <div style="padding: 30px; background: white; color: black; font-family: 'Times New Roman', Times, serif; width: 100%; box-sizing: border-box;">
                    
                    <table style="width: 100%; border-bottom: 3px double black; margin-bottom: 20px; padding-bottom: 10px; border-collapse: collapse;">
                        <tr>
                            <td style="width: 15%; text-align: center; vertical-align: middle;">
                                <img src="${appState.settings.kopLeftLogo}" style="width: 80px; height: 80px; min-width: 80px; min-height: 80px; max-width: 80px; max-height: 80px; object-fit: contain;">
                            </td>
                            <td style="width: 70%; text-align: center; vertical-align: middle; line-height: 1.2;">
                                <h3 style="margin:0; font-size:16px; font-weight:bold; font-family: 'Times New Roman', Times, serif;">PEMERINTAH KOTA MANADO</h3>
                                <h3 style="margin:0; font-size:16px; font-weight:bold; font-family: 'Times New Roman', Times, serif;">DINAS PENDIDIKAN DAN KEBUDAYAAN</h3>
                                <h2 style="margin:5px 0; font-size:22px; font-weight:900; font-family: 'Times New Roman', Times, serif;">${appState.settings.schoolName}</h2>
                                <p style="margin:0; font-size:12px; font-style:italic; font-family: 'Times New Roman', Times, serif;">${appState.settings.schoolAddress}</p>
                            </td>
                            <td style="width: 15%; text-align: center; vertical-align: middle;">
                                <img src="${appState.settings.kopRightLogo}" style="width: 80px; height: 80px; min-width: 80px; min-height: 80px; max-width: 80px; max-height: 80px; object-fit: contain;">
                            </td>
                        </tr>
                    </table>

                    <h3 style="text-align:center; margin-bottom:20px; font-weight:bold; text-decoration:underline;">LAPORAN HASIL BELAJAR</h3>
                    
                    <table style="width:100%; font-size:14px; margin-bottom:20px; border-collapse: collapse;">
                        <tr>
                            <td style="width:120px; padding: 2px;">Nama</td><td style="padding: 2px;">: <b>${student.name}</b></td>
                            <td style="width:100px; padding: 2px;">Kelas</td><td style="padding: 2px;">: <b>${cls}</b></td>
                        </tr>
                        <tr>
                            <td style="padding: 2px;">NISN</td><td style="padding: 2px;">: ${student.nis}</td>
                            <td style="padding: 2px;">Semester</td><td style="padding: 2px;">: ${appState.settings.semester}</td>
                        </tr>
                    </table>
                    
                    <h4 style="margin-bottom:8px; font-weight:bold;">A. Pencapaian Akademik</h4>
                    <table style="width:100%; border-collapse:collapse; margin-bottom:25px; font-size:13px;">
                        <thead style="background-color:#e5e7eb; font-weight:bold;">
                            <tr><td style="border:1px solid black; padding:8px; text-align:center;">No</td><td style="border:1px solid black; padding:8px;">Mata Pelajaran</td><td style="border:1px solid black; padding:8px; text-align:center;">Nilai Akhir</td><td style="border:1px solid black; padding:8px; text-align:center;">Predikat</td><td style="border:1px solid black; padding:8px;">Deskripsi</td></tr>
                        </thead>
                        <tbody>${gradesHtml}</tbody>
                    </table>
                    
                    <table style="width: 100%; margin-bottom: 20px; font-size: 13px; border-collapse: collapse;">
                        <tr>
                            <td style="width: 48%; vertical-align: top;">
                                <h4 style="font-weight:bold; margin-bottom:8px;">B. Ekstrakurikuler & Kokurikuler</h4>
                                <table style="width:100%; border-collapse:collapse;">
                                    <tr><td style="border:1px solid black; padding:6px; font-weight:bold;">Kegiatan</td><td style="border:1px solid black; padding:6px; font-weight:bold; text-align:center;">Keterangan</td></tr>
                                    <tr><td style="border:1px solid black; padding:6px;">${val('eks1_nama')||'Pramuka'}</td><td style="border:1px solid black; padding:6px; text-align:center;">${val('eks1_ket')}</td></tr>
                                    <tr><td style="border:1px solid black; padding:6px;">${val('eks2_nama')||'P5 (Kokurikuler)'}</td><td style="border:1px solid black; padding:6px; text-align:center;">${val('eks2_ket')}</td></tr>
                                </table>
                            </td>
                            <td style="width: 4%;"></td>
                            <td style="width: 48%; vertical-align: top;">
                                <h4 style="font-weight:bold; margin-bottom:8px;">C. Ketidakhadiran</h4>
                                <table style="width:100%; border-collapse:collapse;">
                                    <tr><td style="border:1px solid black; padding:6px;">Sakit</td><td style="border:1px solid black; padding:6px; text-align:center;">${val('sakit')} hari</td></tr>
                                    <tr><td style="border:1px solid black; padding:6px;">Izin</td><td style="border:1px solid black; padding:6px; text-align:center;">${val('izin')} hari</td></tr>
                                    <tr><td style="border:1px solid black; padding:6px;">Alpa Tanpa Keterangan</td><td style="border:1px solid black; padding:6px; text-align:center;">${val('alpa')} hari</td></tr>
                                </table>
                            </td>
                        </tr>
                    </table>

                    <h4 style="font-weight:bold; font-size:13px; margin-bottom:8px;">D. Catatan Wali Kelas</h4>
                    <div style="border:1px solid black; padding:10px; min-height:60px; font-size:13px; margin-bottom:40px; font-style:italic;">
                        "${val('catatan')}"
                    </div>
                    
                    <table style="width:100%; text-align:center; font-size:14px; margin-top:20px; border-collapse: collapse;">
                        <tr>
                            <td style="width:33%; vertical-align: top;">Mengetahui,<br>Orang Tua/Wali<br><br><br><br>_________________</td>
                            <td style="width:34%;"></td>
                            <td style="width:33%; vertical-align: top;">${appState.settings.printDate}<br>Wali Kelas<br><br><br><br><b><u>${waliData?waliData.name:'-'}</u></b><br>NIP. ${waliData?waliData.nip:'-'}</td>
                        </tr>
                        <tr>
                            <td colspan="3" style="padding-top:40px; vertical-align: top;">Kepala Sekolah<br><br><br><br><b><u>${appState.settings.headmasterName}</u></b><br>NIP. ${appState.settings.headmasterNip}</td>
                        </tr>
                    </table>
                </div>
            `;
        };
        window.generateRapot = () => { const sId = UI.val('rapot-student'); const cls = UI.val('rapot-class'); if(!sId) { UI.hide('rapot-preview'); return; } UI.html('rapot-preview', getSingleRapotHTML(appState.students.find(s => s.id === sId), cls)); UI.show('rapot-preview'); };
        
        window.downloadWordRapot = () => { 
            const sId = UI.val('rapot-student'); 
            if(!sId) return; 
            
            const student = appState.students.find(s => s.id === sId);
            let htmlContent = getSingleRapotHTML(student, UI.val('rapot-class'));
            
            let baseUrl = window.location.href.split('?')[0].split('#')[0];
            baseUrl = baseUrl.substring(0, baseUrl.lastIndexOf("/") + 1);
            
            htmlContent = htmlContent.replace(/src="([^"]+)"/g, (match, src) => {
                if (!src.startsWith('http') && !src.startsWith('data:')) {
                    return `src="${baseUrl}${src}"`; 
                }
                return match;
            });
            
            const wordStyles = `
                <style>
                    @page WordSection1 { size: 8.5in 14.0in; margin: 1.0in 1.0in 1.0in 1.0in; mso-header-margin: 0.5in; mso-footer-margin: 0.5in; mso-paper-source: 0; }
                    div.WordSection1 { page: WordSection1; }
                    table { border-collapse: collapse; }
                </style>
            `;

            const fullHtml = `
                <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
                <head><meta charset='utf-8'><title>Rapot ${student.name}</title>${wordStyles}</head>
                <body><div class="WordSection1">${htmlContent}</div></body>
                </html>
            `; 
            
            const blob = new Blob(['\ufeff', fullHtml], {type: 'application/msword'}); 
            const link = document.createElement('a'); 
            link.href = URL.createObjectURL(blob); 
            link.download = `Rapot_${student.name.replace(/\s+/g, '_')}_Kelas_${UI.val('rapot-class')}.doc`; 
            document.body.appendChild(link); 
            link.click(); 
            document.body.removeChild(link); 
        };
        
        window.printRapot = () => { html2pdf().set({margin:0, filename:'Rapot.pdf', html2canvas:{scale:2}, jsPDF:{unit:'mm', format:'legal'}}).from(document.getElementById('rapot-preview')).save(); };
        window.printAllRapot = () => { const cls = UI.val('rapot-class'); const stds = appState.students.filter(s => s.class === cls); if(!stds.length) return; let html = '<div style="background:white; color:black;">'; stds.forEach((s, i) => { html += getSingleRapotHTML(s, cls); if (i < stds.length - 1) html += '<div class="html2pdf__page-break"></div>'; }); html += '</div>'; const d = document.createElement('div'); d.innerHTML = html; html2pdf().set({margin:0, filename:`Semua_Rapot_Kelas_${cls}.pdf`, html2canvas:{scale:2}, jsPDF:{unit:'mm', format:'legal'}}).from(d).save(); };
    </script>
